name: 🐛 Bug Report
description: Report an issue or unexpected behavior in AuthShift
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if a similar issue has already been reported before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When switching personas on localhost:3000...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Log in as Admin
        2. Snapshot persona
        3. Switch to Guest persona
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and Auth stack (e.g. Chrome 130 on Windows 11; Next.js + Clerk/Supabase).
      placeholder: Chrome 130, Next.js 15, Clerk Auth
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Console Logs
      description: Add any relevant DevTools console warnings or screenshots here.
